spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 初始化时池中建立的物理连接个数
      initial-size: 1
      # 连接池中最小空闲连接数，当连接数少于此值时，连接池会创建连接来补充到该值的数量
      min-idle: 1
      # 连接池中最大的可活跃的连接池数量
      max-active: 20
      # 获取连接时最大等待时间，单位毫秒，超过连接就会失效。配置了 maxWait 之后，缺省启用公平锁，并发效率会有所下降，如果需要可以通过配置 useUnfairLock 属性为 true 使用非公平锁
      max-wait: 60000
      # 每 timeBetweenEvictionRunsMillis 毫秒检查一次连接池中空闲的连接，把空闲时间超过 minEvictableIdleTimeMillis 毫秒的连接断开
      time-between-eviction-runs-millis: 60000
      # 指定一个空闲连接最少空闲多久后可被清除，单位毫秒
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      # 增强 timeBetweenEvictionRunsMillis 的周期性连接检查，minIdle 内的空闲连接，每次检查强制验证连接有效性
      keep-alive: true
      # 物理最大连接数
      phy-max-use-count: 100000
      # 用来检测连接是否有效的 sql，要求是一个查询语句
      validation-query: SELECT 1
      # SQL 查询验证超时时间（秒），小于或等于 0 的数值表示禁用
      validation-query-timeout: 30000
      # 建议配置为 true，不影响性能，并且保证安全性。 申请连接的时候检测，如果空闲时间大于 timeBetweenEvictionRunsMillis，执行 validationQuery 检测连接是否有效
      test-while-idle: true
      # 申请连接时执行 validationQuery 检测连接是否有效，做了这个配置会降低性能。设置为 false
      test-on-borrow: false
      # 归还连接时执行 validationQuery 检测连接是否有效，做了这个配置会降低性能,设置为 false
      test-on-return: false
      # 是否缓存 preparedStatement，也就是 PSCache
      pool-prepared-statements: false
      # 池中能够缓冲的 preparedStatements 语句数量
      max-pool-prepared-statement-per-connection-size: 200
      # 配置监控服务器
      stat-view-servlet:
        enabled: true
        # 添加 IP 白名单, 不进行配置默认只允许本机
        allow:
        # 添加 IP 黑名单，当白名单和黑名单重复时，黑名单优先级更高
        deny:
        # 添加控制台管理用户
        login-username:
        login-password:
        url-pattern: '/druid/*'
        # 是否能够重置数据
        reset-enable: false
      # 配置服务过滤器
      web-stat-filter:
        enabled: true
        profile-enable: true
        # 添加过滤规则, 默认配置
        url-pattern: '/*'
        # 忽略过滤格式, 默认配置
        exclusions: '*.js, *.gif, *.jpg, *.png, *.css, *.ico, /druid/*'
        principal-session-name: Krismile-Session
      # 配置监控统计拦截的 filters，去掉后监控界面 sql 无法统计，wall 用于防火墙
      filters: stat, wall, slf4j
      # 慢 sql 记录
      filter:
        stat:
          merge-sql: true
          slow-sql-millis: 10000
          log-slow-sql: true
      # 配置 spring 监控
      aop-patterns: 'cn.krismile.ai.*.service.*, cn.krismile.ai.*.mapper.*'
      # 合并多个 DruidDataSource 的监控数据
      use-global-data-source-stat: true
mybatis-flex:
  global-config:
    logic-delete-column: del_flag